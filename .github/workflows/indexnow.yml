name: Notify search engines

on:
  workflow_run:
    workflows: [Site quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify-indexnow:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Notify participating search engines after production is verified
        env:
          PUBLISHED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/notify-indexnow.mjs --commit "$PUBLISHED_COMMIT" --submit
