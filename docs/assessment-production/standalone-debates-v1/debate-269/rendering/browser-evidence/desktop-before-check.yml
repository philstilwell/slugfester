            - listitem [ref=e693]: His best replies drew useful distinctions between efficient and material causes, between deliberation and choice, and between causing matter and causing an ordered state.
            - listitem [ref=e694]: He repeatedly returned to real events, causal dependence, and the need for differentiation, giving the affirmative case a recognizable inferential spine across the full exchange.
          - heading "Whiffed" [level=3] [ref=e695]
          - list [ref=e696]:
