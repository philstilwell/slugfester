                - generic: "Strongest feature: Linford explains the crucial construction rather than merely naming a theorem: even the combined past light cones of every possible observer can occur within observationally indistinguishable spacetimes possessing different global properties. Principal limitation: The result is deliberately restricted to what local observation can determine, so it does not refute an independently sound philosophical deduction or establish that physical reality is actually beginningless. Live burden: Any scientific beginning inference must identify information unavailable to the equivalence construction, whereas Loke's alternative route must defend its premises without treating local cosmological success as evidence of a global boundary. Locked score: Ninety-two reflects exceptional logical force, precision, responsiveness, and motion-level relevance, with only the properly bounded limitation that this powerful underdetermination result governs observational warrant rather than every conceivable argument about beginnings."
