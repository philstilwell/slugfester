            - strong [ref=e245]: "87"
          - paragraph [ref=e246]: Without a temporal metric, duration is neither finite nor infinite; thus rejecting an infinite past does not establish a finite past or a beginning of physical reality.
          - generic [ref=e247]:
            - generic [ref=e248]:
              - button "Critique for Opening case" [ref=e249] [cursor=pointer]: ◉
              - tooltip:
                - strong: 87/100 · Opening case
                - generic: "Strongest feature: Linford identifies a third option to the familiar finite-or-infinite duration dichotomy: an ordered past lacking a length metric, which directly blocks the inference from non-infinity to a beginning. Principal limitation: The real-line illustration makes the concept intelligible, but the opening only briefly asserts that relevant cosmological models contain such intervals, so the alternative's physical applicability receives less support than its conceptual coherence. Live burden: A beginning advocate must show either that every possible past admits metric length or that a first event establishes beginning independently of finite duration; merely rejecting infinitely many changes will not suffice. Locked score: Eighty-seven recognizes a highly responsive, precise, and burden-relevant counterexample, while the comparatively compressed warrant for treating nonmetric cosmologies as live rather than merely conceivable keeps it below the exceptional range."
