            - generic [ref=e222]: Opening case
            - strong [ref=e223]: "89"
          - paragraph [ref=e224]: Big Bang expansion and singularity theorems depend on limited domains, unverified assumptions, and inaccessible regions, so present physics cannot establish that all physical reality began.
          - generic [ref=e225]:
            - generic [ref=e226]:
              - button "Critique for Opening case" [ref=e227] [cursor=pointer]: ◉
              - tooltip:
                - strong: 89/100 · Opening case
                - generic: "Strongest feature: Linford combines several concrete restrictions—the Big Bang's hot dense phase, theorem-dependent assumptions, observational horizons, and theory breakdown at singular regimes—into a coherent case against inferring an absolute global beginning from contemporary cosmology. Principal limitation: Because these considerations arrive compactly, their individual applications are asserted more rapidly than defended, especially the scope of the theorem assumptions and the precise consequences of exceeding a physical theory's domain. Live burden: The opposing case must supply evidence that reaches every relevant spatial region and survives quantum-gravity uncertainty, or else establish the beginning through an independent philosophical deduction. Locked score: Eighty-nine rewards the move's unusually strong relevance, calibration, and responsive distinction between a local cosmic history and all physical reality, while retaining a bounded evidential discount for compressed technical warrants."
            - generic [ref=e228]: No named fallacy
