                - generic: "Strongest feature: Dawkins identifies two distinct usages in Chopra’s own examples—quantum as a metaphor for unexplained biological change and quantum as literal physics in technological processes—and explains the inferential cost of sliding between them. Principal limitation: the accusation that Chopra is bamboozling listeners imputes an effect, possibly intent, more strongly than the evidence supports, and saying the biological questions have nothing whatsoever to do with quantum phenomena is broader than required. Live burden: he must show that no connecting mechanism was provided, not that metaphor or cross-disciplinary inquiry is inherently illegitimate. Locked score: 89 reflects exceptional coherence, responsiveness, precision, and evidential grounding in the examples actually offered, with small deductions for rhetorical overstatement and for a categorical scientific exclusion that the debate itself does not independently establish."
