          - heading "Landed" [level=3] [ref=f4e542]
          - list [ref=f4e543]:
            - listitem [ref=f4e544]: Wilson consistently targets explanatory foundations, asking what makes rational assertion and objective value possible instead of merely trading isolated examples with Hitchens.
            - listitem [ref=f4e545]: His macrocosmic and microcosmic reply correctly shows that natural grandeur and particular miracles are logically compatible, even though compatibility alone cannot establish either miracle.
            - listitem [ref=f4e546]: His fullest response to the swine story concedes that Hitchens's reduced reading would be tawdry, then restores the healed man and community reaction with unusual charity.
          - heading "Whiffed" [level=3] [ref=f4e547]
          - list [ref=f4e548]:
            - listitem [ref=f4e549]:
              - text: Wilson's claim that an indifferent universe leaves Hitchens with no objection to killing conflates cosmic indifference with human moral judgment and ignores Hitchens's stated concern for victims.
              - link "Equivocation" [ref=f4e551] [cursor=pointer]:
                - /url: /reference/fallacy/equivocation/?debate=hitchens-wilson-truth-goodness-beauty-2008
            - listitem [ref=f4e552]: He repeatedly asserts that objective truth, goodness, and beauty require God without excluding secular realist alternatives, leaving the central grounding bridge less defended than his confident conclusion suggests.
        - article [ref=f4e553]:
          - generic [ref=f4e554]:
            - generic [ref=f4e555]: Atheistic naturalism · Christopher Hitchens
            - strong [ref=f4e556]: "80"
          - heading "Landed" [level=3] [ref=f4e557]
          - list [ref=f4e558]:
            - listitem [ref=f4e559]: Hitchens's divine-command reply directly meets Wilson's accountability challenge by showing that purported divine authority can itself license killing and slavery that ordinary humanitarian judgment condemns.
            - listitem [ref=f4e560]: "His Humean test is exceptionally well calibrated: miracle reports remain possible, but must compete with misapprehension under a shared comparative standard rather than receiving automatic dismissal or privilege."
            - listitem [ref=f4e561]: He gives a concrete secular account of beauty through natural awe and cultural preservation, showing that rejecting supernatural claims need not erase transcendence, artistic creation, or inherited religious art.
          - heading "Whiffed" [level=3] [ref=f4e562]
          - list [ref=f4e563]:
            - listitem [ref=f4e564]: Hitchens overstates his inquiry case by treating faith as certainty and skepticism as the only route to discovery, overlooking qualified religious belief and the historical coexistence of faith with inquiry.
            - listitem [ref=f4e565]: His claim that no religion begins without a miraculous birth is sweeping and under-supported; the recurring-pattern objection remains useful, but the universal formulation weakens its precision and warrant.
