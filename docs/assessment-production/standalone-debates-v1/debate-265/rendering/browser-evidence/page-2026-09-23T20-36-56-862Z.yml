              - tooltip:
                - strong: 78/100 · Diagnostic challenge
                - generic: "Strongest feature: Donahue keeps attention on the disputed consequence by asking for an alternative partition that actually makes biological life unlikely, rather than accepting a purely abstract observation about representational granularity as decisive. Principal limitation: The request shifts too much responsibility to the skeptic, because failure to supply a rival partition would not validate Donahue’s original three-category division or its unsupported one-tenth assignment. Live burden: The affirmative retains the obligation to justify why its partition is privileged, complete, and probabilistically meaningful before demanding a quantitatively superior replacement. Locked score: 78 records a strong, clear, and directly responsive diagnostic challenge, tempered by its limited evidential support and partial burden shift away from the side proposing the probability."
