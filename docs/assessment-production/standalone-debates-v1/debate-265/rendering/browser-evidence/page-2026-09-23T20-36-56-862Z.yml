            - strong [ref=f2e619]: "88"
          - paragraph [ref=f2e620]: If replacing auxiliary hypotheses shields naturalism from disconfirmation, identical reasoning can shield theism, so the maneuver cannot independently establish an asymmetric worldview comparison.
