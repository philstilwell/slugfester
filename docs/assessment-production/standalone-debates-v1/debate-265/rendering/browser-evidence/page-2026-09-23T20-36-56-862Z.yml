            - generic [ref=f2e585]: Diagnostic challenge
            - strong [ref=f2e586]: "78"
          - paragraph [ref=f2e587]: Noting alternative partitions does not lower theism’s biological-life likelihood by itself, so the skeptic is invited to propose a better division with different consequences.
          - generic [ref=f2e588]:
            - generic [ref=f2e589]:
