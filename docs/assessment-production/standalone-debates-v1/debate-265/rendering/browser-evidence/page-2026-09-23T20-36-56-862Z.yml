            - generic [ref=f2e228]: Comparative case
            - strong [ref=f2e229]: "77"
          - paragraph [ref=f2e230]: A value-sensitive creator could favor conscious life and beauty while naturalism privileges no life-permitting range, allegedly making fine-tuning comparatively likelier on theism.
