          - paragraph [ref=f2e565]: Naturalism cannot escape every failed model through unspecified alternatives because rescue hypotheses matter only according to their intrinsic plausibility and prior probability.
          - generic [ref=f2e566]:
            - generic [ref=f2e567]:
              - button "Critique for Rescue constraint" [ref=f2e568] [cursor=pointer]: ◉
              - tooltip:
                - strong: 84/100 · Rescue constraint
                - generic: "Strongest feature: Donahue correctly notes that a broad worldview is not rescued merely by the logical existence of better-predicting variants, because those variants influence its likelihood only through their prior weights and evidential fit. Principal limitation: The general Bayesian point is sound, but the debate supplies no basis for his claim that multiverse proposals occupied a huge share of naturalistic probability or that the remaining alternatives are collectively weak. Live burden: He must discipline qualitative reasoning with defensible comparative weights rather than use the rejection of costless pivoting to infer a low naturalistic likelihood directly. Locked score: 84 reflects a strong, responsive, and centrally relevant constraint on model flexibility, reduced by unsupported claims about probability mass and the still-unfinished overall worldview comparison."
