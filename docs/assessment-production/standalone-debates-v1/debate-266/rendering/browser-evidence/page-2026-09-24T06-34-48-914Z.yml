            - strong [ref=f2e215]: "84"
          - paragraph [ref=f2e216]: Confidence may be rational when evidence supports it, but relabeling confidence as faith risks turning a measured attitude into an independent justification.
          - generic [ref=f2e217]:
            - generic [ref=f2e218]:
              - button "Critique for Direct reply" [ref=f2e219] [cursor=pointer]: ◉
              - tooltip:
                - strong: 84/100 · Direct reply
                - generic: "Strongest feature: Dillahunty concedes that confidence can be rational when supported by evidence, then identifies the equivocation risk when “faith” shifts from naming calibrated confidence to becoming “the reason I believe,” directly qualifying Giunta’s trust definition without denying common ground. Principal limitation: The passage warns about a recognizable switch but does not show Giunta making it here, leaving the caution plausible rather than a demonstrated defect in his usage. Live burden: This distinction blocks a definitional shortcut, yet Dillahunty must connect the warning to the motion by showing why evidence-compatible trust cannot be rationally justified before God’s possibility is demonstrated. Locked score: The fixed 84 rewards a clear, charitable, responsive distinction while withholding higher credit because the alleged equivocation remains hypothetical and the motion-level bridge incomplete."
            - generic [ref=f2e220]: No named fallacy
        - article [ref=f2e221]:
          - generic [ref=f2e222]:
            - link "Open YouTube source at 7:42" [ref=f2e224] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=QHg_NL4EUAE&t=462s
              - text: 7:42
            - generic [ref=f2e225]: Constructive
            - strong [ref=f2e226]: "78"
          - paragraph [ref=f2e227]: Christian faith ordinarily means evidence-compatible trust, illustrated by biblical figures who reportedly possessed reasons rather than believing blindly without evidential support.
          - generic [ref=f2e228]:
            - generic [ref=f2e229]:
              - button "Critique for Constructive" [ref=f2e230] [cursor=pointer]: ◉
              - tooltip:
                - strong: 78/100 · Constructive
                - generic: "Strongest feature: Giunta gives content to faith as trust by invoking ordinary Christian usage, biblical reference works, the Greek term, and the Apostles and Moses, who allegedly witnessed miracles, thereby answering the claim that Christian faith necessarily means belief without evidence. Principal limitation: Those references are summarized rather than documented, while biblical figures portrayed as having evidence illustrate compatibility between trust and evidence without establishing a general rule about Christian usage. Live burden: The move resists dismissal by definition but leaves untouched the narrower question whether rational trust in God requires God’s possibility to be demonstrated first. Locked score: The fixed 78 credits a coherent, relevant clarification while reflecting its broad treatment of Christian practice, limited support for the cited usage, and failure alone to resolve the prior-possibility requirement."
            - generic [ref=f2e231]: No named fallacy
        - article [ref=f2e232]:
          - generic [ref=f2e233]:
            - link "Open YouTube source at 16:59" [ref=f2e235] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=QHg_NL4EUAE&t=1019s
              - text: 16:59
            - generic [ref=f2e236]: Direct reply
            - strong [ref=f2e237]: "72"
          - paragraph [ref=f2e238]: Because reasonable inference can still mislead, as stage magic illustrates, rational justification needs an evidential demonstration connecting the process to its conclusion.
          - generic [ref=f2e239]:
            - generic [ref=f2e240]:
              - button "Critique for Direct reply" [ref=f2e241] [cursor=pointer]: ◉
              - tooltip:
                - strong: 72/100 · Direct reply
                - generic: "Strongest feature: Dillahunty’s magician example shows how an inference can appear reasonable from available evidence yet reach a false conclusion, concretely motivating his demand for evidential demonstration rather than confidence alone. Principal limitation: The example supports stronger checking, but does not establish that God’s possibility must be demonstrated first, while his reply overreads Giunta’s proposal to compare evidence as dismissing demonstration generally. Live burden: Dillahunty must distinguish ordinary evidential support from demonstration as a strict prior prerequisite and explain why comparative evidence cannot justify belief before possibility is separately shown. Locked score: The fixed 72 recognizes an accessible challenge to Giunta’s standard while preserving the gap between showing that reasonable people can be misled and proving the specific prior-possibility rule."
            - generic [ref=f2e242]: No named fallacy
        - article [ref=f2e243]:
          - generic [ref=f2e244]:
            - link "Open YouTube source at 11:18" [ref=f2e246] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=QHg_NL4EUAE&t=678s
              - text: 11:18
            - generic [ref=f2e247]: Constructive
            - strong [ref=f2e248]: "81"
          - paragraph [ref=f2e249]: Perception, memory, intuition, and arithmetic can directly ground beliefs, which then support further conclusions without every later belief requiring an independent demonstration.
          - generic [ref=f2e250]:
            - generic [ref=f2e251]:
              - button "Critique for Constructive" [ref=f2e252] [cursor=pointer]: ◉
              - tooltip:
                - strong: 81/100 · Constructive
                - generic: "Strongest feature: Giunta gives a coherent two-stage account: perceptual seeming can directly support belief in a tree, as memory, intuition, and arithmetic support starting beliefs, which can then support further conclusions. Principal limitation: These examples illustrate direct and recursive support, but do not show that belief in God fits either route, leaving theism unconnected to the proposed foundations. Live burden: Giunta must identify which experience or prior belief supports religious trust, explain how that support can be checked, and show why this route answers the demand for a separate possibility demonstration. Locked score: The fixed 81 reflects a clear, modest account that does not claim every supported belief is true, while withholding full credit because the bridge from trees, memory, intuition, and arithmetic to theistic belief still remains unstated."
            - generic [ref=f2e253]: No named fallacy
        - article [ref=f2e254]:
          - generic [ref=f2e255]:
            - link "Open YouTube source at 19:13" [ref=f2e257] [cursor=pointer]:
              - /url: https://www.youtube.com/watch?v=QHg_NL4EUAE&t=1153s
              - text: 19:13
            - generic [ref=f2e258]: Constructive
            - strong [ref=f2e259]: "82"
          - paragraph [ref=f2e260]: Bare faith cannot reliably discriminate among incompatible beliefs, since the same appeal can underwrite rival denominations, arbitrary claims, or morally abhorrent conclusions.
          - generic [ref=f2e261]:
            - generic [ref=f2e262]:
              - button "Critique for Constructive" [ref=f2e263] [cursor=pointer]: ◉
              - tooltip:
                - strong: 82/100 · Constructive
                - generic: "Strongest feature: Dillahunty concretizes nondiscrimination by contrasting evidence-based confidence with freestanding faith, which could equally authorize incompatible denominations, racial supremacy, or any assertion offered without reasons. Principal limitation: Because he expressly exempts Giunta from that foundational usage, the examples expose equivocation but neither refute evidence-compatible religious trust nor establish that God's possibility requires prior demonstration. Live burden: The move supports the subsidiary warning that rational standing cannot transfer from confidence grounded in evidence to faith treated as its own warrant, while leaving the motion-level bridge from indiscriminate justification to the prior-possibility rule unproved. Locked score: The fixed 82 rewards coherent, unusually charitable reasoning anchored in specific denominational and racial-supremacy counterexamples, while reserving higher credit because the criticized position is not Giunta's and the demonstrated conclusion remains local."
            - generic [ref=f2e264]: No named fallacy
