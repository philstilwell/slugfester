            - listitem [ref=f3e762]:
              - text: The fallen-world defense never shows why an omnipotent God lacked less destructive alternatives, leaving scriptural violence and extensive suffering insufficiently reconciled.
              - link "Special pleading" [ref=f3e764] [cursor=pointer]:
