            - listitem [ref=f3e754]: He carefully limits intelligent design to an architect, avoiding the unsupported leap from biological complexity to Christian revelation or divine goodness.
            - listitem [ref=f3e755]: His origin-versus-loss distinction directly exposes why cave-eye degeneration does not by itself explain the construction of integrated visual machinery.
            - listitem [ref=f3e756]: He concedes scientific uncertainty and evolutionary scope where appropriate, strengthening his replies by separating modest evidential claims from comprehensive theological conclusions.
          - heading "Whiffed" [level=3] [ref=f3e757]
          - list [ref=f3e758]:
            - listitem [ref=f3e759]:
              - text: The moral-grounding case largely assumes that objective norms must derive from God without explaining why divine nature is good rather than merely authoritative.
              - link "Begging the question" [ref=f3e761] [cursor=pointer]:
