          - heading "Landed" [level=3] [ref=f3e769]
          - list [ref=f3e770]:
            - listitem [ref=f3e771]: He consistently separates evidence for an unspecified designer from the additional burdens of revelation, providence, perfect goodness, and personal divine concern.
            - listitem [ref=f3e772]: His atonement objection sharply distinguishes transferable costs from nontransferable agency, forcing the Christian defense to clarify liability, forgiveness, and historical responsibility.
            - listitem [ref=f3e773]: He connects suffering, scriptural commands, and cosmic disorder directly to the motion’s goodness claim rather than treating generic disbelief as sufficient.
          - heading "Whiffed" [level=3] [ref=f3e774]
