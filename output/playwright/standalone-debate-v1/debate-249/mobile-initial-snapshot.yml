              - tooltip:
                - strong: 91/100 · Major direct reply
                - generic: "Strongest feature: Bush separates the question respondents answered from the intuition Adelstein attributes to them, then applies representativeness concerns symmetrically to the personal poll, philosopher sample, and studies congenial to anti-realism. Principal limitation: The named research and reported modal responses are described rather than reproduced, so the exchange supports a methodological correction more decisively than any comprehensive estimate of ordinary moral understanding. Live burden: Establishing a population-level conclusion would require comparable questions, broader sampling, and attention to how respondents interpret realist terminology, rather than replacing the original majority appeal with another convenient survey. Locked score: The frozen 91 recognizes unusually direct evidential discrimination, concrete research references, and disciplined uncertainty, because the reply substantially weakens claimed intuitive priority without pretending that uncertain public opinion itself establishes anti-realism."
