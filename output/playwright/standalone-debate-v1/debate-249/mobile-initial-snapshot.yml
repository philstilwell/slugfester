                - strong: 84/100 · Major direct reply
                - generic: "Strongest feature: The future-self example exposes the difference between information that advances existing objectives and recommendations grounded in somebody else's changed preferences, while expressly conceding genuine facts about means and present goals. Principal limitation: Refusing unwanted advice demonstrates motivational resistance, not the nonexistence of independent authority, so the dismissive response to the second possibility cannot itself settle the question Railton's defender raises. Live burden: Bush must keep the successful criticism of the ordinary-advice analogy separate from any stronger claim that an agent's unwillingness to comply disproves a normative reason, however comprehensively informed the adviser becomes. Locked score: The locked 84 recognizes precise engagement with idealization and a material challenge to the independence inference, tempered by the unresolved distinction between rejecting a recommendation and establishing that it lacks authority."
