                - generic: "Strongest feature: Adelstein identifies semantic explanation as a substantive route available to naturalist realists, countering wholesale dismissal by treating their proposals as potentially plausible theories about what participants mean in moral conversation. Principal limitation: The supposed shared reference remains unspecified, and no particular language analysis or observed usage is supplied to show why a naturalist interpretation explains actual discourse better than its competitors. Live burden: The defense requires criteria for evaluating rival accounts of moral meaning and evidence connecting speakers' expressions to independent moral properties, rather than relying on the general legitimacy of theorizing about language. Locked score: The fixed 75 reflects a charitable, relevant conceptual defense whose evidential development is thin, preserving the distinction between showing that a research program deserves consideration and establishing its preferred semantic conclusions."
